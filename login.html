<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Rimagine</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body class="d-flex flex-column align-items-center justify-content-center p-3">

    <h1 class="brand mb-4"><span>Rimagine</span></h1>

    <div class="card auth-card shadow">
        <div class="card-body p-4">
            <h2 class="h4 mb-1">Welcome back</h2>
            <p class="text-muted mb-4">Log in to manage your shop designs.</p>

            <form action="#" method="post">

                <div class="mb-3">
                    <label for="Email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="Email" name="Email"
                           placeholder="owner@shop.com" required>
                </div>

                <div class="mb-3">
                    <label for="Password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="Password" name="Password"
                           placeholder="Your password" required>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="RememberMe" name="RememberMe">
                    <label class="form-check-label" for="RememberMe">Remember me</label>
                </div>

                <button type="submit" class="btn btn-rimagine w-100">Log in</button>
            </form>

            <p class="text-center mt-4 mb-0">
                New here? <a href="signup.html">Create an account</a>
            </p>
        </div>
    </div>

</body>
</html>
