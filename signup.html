<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up - Rimagine</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body class="d-flex flex-column align-items-center justify-content-center p-3">

    <h1 class="brand mb-4"><span>Rimagine</span></h1>

    <div class="card auth-card shadow">
        <div class="card-body p-4">
            <h2 class="h4 mb-1">Create your account</h2>
            <p class="text-muted mb-4">Set up your shop and start designing.</p>

            <form action="#" method="post">

                <div class="mb-3">
                    <label for="ShopName" class="form-label">Shop name</label>
                    <input type="text" class="form-control" id="ShopName" name="ShopName"
                           placeholder="e.g. Lahore Car Mods" maxlength="100" required>
                </div>

                <div class="mb-3">
                    <label for="Email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="Email" name="Email"
                           placeholder="owner@shop.com" required>
                </div>

                <div class="mb-3">
                    <label for="Password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="Password" name="Password"
                           placeholder="At least 8 characters" minlength="8" required>
                </div>

                <div class="mb-4">
                    <label for="ConfirmPassword" class="form-label">Confirm password</label>
                    <input type="password" class="form-control" id="ConfirmPassword" name="ConfirmPassword"
                           placeholder="Type the password again" minlength="8" required>
                </div>

                <button type="submit" class="btn btn-rimagine w-100">Sign up</button>
            </form>

            <p class="text-center mt-4 mb-0">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>
    </div>

</body>
</html>
